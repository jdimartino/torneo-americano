<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Torneo Americano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/styles.css?v=11">
</head>
<body class="admin-body">

    <header class="app-header" id="login-section">
        <div class="header-top">
            <div class="header-brand">
                <div class="logo">TA</div>
                <div>
                    <h1>Torneo Americano</h1>
                    <div class="header-subtitle"><span class="dot"></span> Admin Panel</div>
                </div>
            </div>
        </div>
        <div class="header-line"></div>
    </header>

    <main>
        <section id="login-container-wrapper">
            <div class="login-container">
                <h2><span class="material-symbols-outlined" style="font-size:1.5rem;vertical-align:middle;">lock</span> Acceso Admin</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div id="login-error" style="display:none;background:var(--error-container);color:white;border:1px solid rgba(255,84,73,0.3);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.75rem;font-size:0.82rem;text-align:center;"></div>
                <button class="btn btn-primary btn-block" id="login-btn">
                    <span class="material-symbols-outlined" style="font-size:1.1rem;">login</span> Ingresar
                </button>
            </div>
        </section>

        <div id="admin-panel" style="display:none;">
            <header class="app-header">
                <div class="admin-header">
                    <div class="header-brand">
                        <div class="logo">TA</div>
                        <h1>Admin</h1>
                    </div>
                    <button class="logout-btn" id="logout-btn">
                        <span class="material-symbols-outlined" style="font-size:0.9rem;">logout</span> Salir
                    </button>
                </div>
                <div class="header-line"></div>
                <nav class="tab-nav">
                    <button class="admin-tab-btn active" data-panel="jugadores" onclick="showPanel('jugadores')">
                        <span class="material-symbols-outlined" style="font-size:1rem;">groups</span> Jugadores
                    </button>
                    <button class="admin-tab-btn" data-panel="eliminatoria" onclick="showPanel('eliminatoria')">
                        <span class="material-symbols-outlined" style="font-size:1rem;">sports_tennis</span> Eliminatoria
                    </button>
                    <button class="admin-tab-btn" data-panel="cuartos-admin" onclick="showPanel('cuartos-admin')">
                        <span class="material-symbols-outlined" style="font-size:1rem;">emoji_events</span> Cuartos
                    </button>
                    <button class="admin-tab-btn" data-panel="semis-admin" onclick="showPanel('semis-admin')">
                        <span class="material-symbols-outlined" style="font-size:1rem;">military_tech</span> Semis
                    </button>
                    <button class="admin-tab-btn" data-panel="final-admin" onclick="showPanel('final-admin')">
                        <span class="material-symbols-outlined" style="font-size:1rem;">workspace_premium</span> Final
                    </button>
                </nav>
            </header>

            <div id="panel-jugadores" class="admin-panel active"></div>
            <div id="panel-eliminatoria" class="admin-panel"></div>
            <div id="panel-cuartos-admin" class="admin-panel"></div>
            <div id="panel-semis-admin" class="admin-panel"></div>
            <div id="panel-final-admin" class="admin-panel"></div>
        </div>
    </main>

    <script type="module" src="js/admin.js?v=11"></script>

</body>
</html>
