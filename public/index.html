<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Torneo Americano</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
    <h1>Torneo Americano</h1>
    <nav class="tab-nav">
        <button data-tab="posiciones" class="active">Posiciones</button>
        <button data-tab="resultados">Resultados</button>
        <button data-tab="cuartos">Cuartos</button>
        <button data-tab="semifinales">Semifinales</button>
        <button data-tab="finales">Final</button>
    </nav>
</header>

<main id="app">
    <section id="posiciones" class="tab-content active"></section>
    <section id="resultados" class="tab-content"></section>
    <section id="cuartos" class="tab-content">
        <div class="bracket-round">
            <div class="bracket-round-header">Cuartos de Final</div>
            <div id="cuartos-matches">
                <div class="empty-state"><div class="empty-icon">&#127934;</div><p>Cargando...</p></div>
            </div>
        </div>
    </section>
    <section id="semifinales" class="tab-content"></section>
    <section id="finales" class="tab-content"></section>
</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
