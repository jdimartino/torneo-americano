<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Torneo Americano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>

<header class="app-header">
    <div class="header-top">
        <div class="header-brand">
            <div class="logo">TA</div>
            <div>
                <h1>Torneo Americano</h1>
                <div class="header-subtitle"><span class="dot"></span> Fase Eliminatoria</div>
            </div>
        </div>
        <div class="header-tennis">&#127934;</div>
    </div>
    <div class="header-line"></div>
    <nav class="tab-nav">
        <button data-tab="posiciones" class="active">
            <span class="material-symbols-outlined" style="font-size:1rem;">leaderboard</span> Posiciones
        </button>
        <button data-tab="resultados">
            <span class="material-symbols-outlined" style="font-size:1rem;">history</span> Resultados
        </button>
        <button data-tab="cuartos">
            <span class="material-symbols-outlined" style="font-size:1rem;">emoji_events</span> Cuartos
        </button>
        <button data-tab="semifinales">
            <span class="material-symbols-outlined" style="font-size:1rem;">military_tech</span> Semis
        </button>
        <button data-tab="finales">
            <span class="material-symbols-outlined" style="font-size:1rem;">workspace_premium</span> Final
        </button>
    </nav>
</header>

<main id="app">
    <section id="posiciones" class="tab-content active"></section>
    <section id="resultados" class="tab-content"></section>
    <section id="cuartos" class="tab-content"></section>
    <section id="semifinales" class="tab-content"></section>
    <section id="finales" class="tab-content"></section>
</main>

<script type="module" src="js/app.js?v=6"></script>

</body>
</html>
